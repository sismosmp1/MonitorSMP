<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SISMOS MP RECEPTOR - EDICIÓN MÉXICO 🇲🇽</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&display=swap" rel="stylesheet">

<style>
* {
margin:0;
padding:0;
box-sizing:border-box;
font-family: 'Oswald', Arial, sans-serif;
}

/* El fondo de cancha lo ponemos en el HTML para que el JS no lo borre al cambiar el background del body */
html {
background-color: #006847; /* Verde Bandera */
background-image: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 40px,
    rgba(255, 255, 255, 0.05) 40px,
    rgba(255, 255, 255, 0.05) 80px
);
height: 100vh;
}

body {
background: transparent !important; /* Forzamos transparencia para ver la cancha */
color: white;
height: 100vh;
overflow: hidden;
display: flex;
justify-content: center;
align-items: center;
flex-direction: column;
transition: .3s;
}

/* STATUS TRICOLOR */
.status {
position: absolute;
top: 20px;
left: 20px;
right: 20px;
display: flex;
justify-content: space-between;
align-items: center;
background: rgba(0, 45, 30, 0.85); /* Verde oscuro translúcido */
padding: 16px 20px;
border-radius: 15px;
border-bottom: 4px solid #fff;
border-image: linear-gradient(to right, #006847 0%, #FFFFFF 50%, #CE1126 100%) 1;
backdrop-filter: blur(10px);
box-shadow: 0 10px 20px rgba(0,0,0,0.5);
}

.status-left {
display: flex;
align-items: center;
gap: 12px;
}

.wifi {
font-size: 28px;
animation: pulse 1s infinite;
}

.online {
display: flex;
flex-direction: column;
}

.online strong {
font-size: 18px;
color: #cfab7a; /* Dorado */
letter-spacing: 1px;
}

.online span {
font-size: 13px;
opacity: .9;
font-weight: 400;
text-transform: uppercase;
}

.dot {
width: 12px;
height: 12px;
background: #00ff84;
border-radius: 50%;
margin-left: 10px;
box-shadow: 0 0 10px #00ff84;
animation: pulse 1s infinite;
}

@keyframes pulse {
50% {
transform: scale(1.3);
opacity: .6;
}
}

/* RELOJ DE MARCADOR */
.reloj {
font-size: 120px;
font-weight: 700;
letter-spacing: 2px;
color: #ffffff;
text-shadow: 0 5px 0 #004d34, 0 10px 25px rgba(0,0,0,0.7);
margin-bottom: -10px;
}

.fecha {
margin-top: 10px;
font-size: 24px;
color: #cfab7a; /* Dorado Mundialista */
text-transform: uppercase;
letter-spacing: 3px;
text-shadow: 0 2px 5px rgba(0,0,0,0.8);
}

.info {
position: absolute;
bottom: 20px;
font-size: 16px;
color: #ffffff;
letter-spacing: 2px;
text-shadow: 0 2px 5px rgba(0,0,0,0.8);
background: rgba(0,0,0,0.4);
padding: 8px 15px;
border-radius: 10px;
}

/* ALERTA FUERTE */
.alerta {
position: fixed;
top: 0;
left: 0;
width: 100%;
height: 100%;
background: #CE1126; /* Rojo Bandera */
display: none;
justify-content: center;
align-items: center;
flex-direction: column;
z-index: 999999;
text-align: center;
padding: 25px;
animation: flash .5s infinite;
}

.alerta.active {
display: flex;
}

@keyframes flash {
50% {
background: #ff1744;
}
}

.alerta h1 {
font-size: 80px;
margin-bottom: 20px;
text-transform: uppercase;
text-shadow: 4px 4px 0 #000;
letter-spacing: 2px;
}

.alerta p {
font-size: 35px;
max-width: 800px;
line-height: 1.5;
text-shadow: 2px 2px 0 #000;
}

.btnCerrar {
margin-top: 40px;
padding: 20px 40px;
border: 3px solid #fff;
border-radius: 10px;
background: linear-gradient(to right, #006847, #CE1126); /* Botón Tricolor */
color: white;
font-size: 24px;
font-weight: 700;
letter-spacing: 2px;
cursor: pointer;
text-transform: uppercase;
box-shadow: 0 10px 20px rgba(0,0,0,0.5);
transition: transform 0.2s;
}

.btnCerrar:active {
transform: scale(0.95);
}

/* ALERTA DÉBIL (TARJETA AMARILLA) */
.toast {
position: fixed;
top: 20px;
left: 20px;
right: 20px;
background: #fcd116; /* Amarillo tarjeta */
color: #111;
padding: 20px;
border-radius: 15px;
border-left: 10px solid #CE1126;
display: none;
z-index: 999999;
box-shadow: 0 10px 30px rgba(0,0,0,.5);
animation: slide .3s;
}

.toast.active {
display: block;
}

.toast h3 {
font-size: 24px;
margin-bottom: 5px;
text-transform: uppercase;
}

.toast p {
font-size: 18px;
line-height: 1.5;
font-weight: 600;
}

@keyframes slide {
from {
transform: translateY(-100px);
opacity: 0;
}
to {
transform: translateY(0);
opacity: 1;
}
}

</style>
</head>

<body>

<div class="status">
<div class="status-left">
<div class="wifi">⚽</div>
<div class="online">
<strong>CONECTADO A LA CANCHA</strong>
<span>Recibiendo datos en tiempo real</span>
</div>
<div class="dot"></div>
</div>
<div>
SISMOS MP - MÉXICO 🇲🇽
</div>
</div>

<div class="reloj" id="reloj">
00:00:00
</div>
<div class="fecha" id="fecha">
Cargando fecha...
</div>
<div class="info">
🏆 SISMOS MP APP | EDICIÓN SELECCIÓN MEXICANA 🇲🇽
</div>

<div class="alerta" id="alerta">
<h1 id="tituloAlerta">🚨 ALERTA SÍSMICA</h1>
<p id="mensajeAlerta">Sismo detectado</p>
<button class="btnCerrar" onclick="detenerTodo()">CERRAR ALERTA</button>
</div>

<div class="toast" id="toast">
<h3 id="tituloToast">🟡 Movimiento detectado</h3>
<p id="mensajeToast">Información del evento</p>
</div>

<audio id="audioFuerte" preload="auto" loop>
<source src="https://raw.githubusercontent.com/sismosmp1/sismosmp-audio1/main/sirena_1min.mp3" type="audio/mpeg">
</audio>

<audio id="audioDebil" preload="auto">
<source src="https://assets.mixkit.co/active_storage/sfx/952/952-preview.mp3" type="audio/mpeg">
</audio>

<audio id="audioEmergencia" preload="auto">
<source src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" type="audio/mpeg">
</audio>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>

/* FIREBASE */
const firebaseConfig = {
apiKey: "AIzaSyC6-l7pOmp6Pe374UqzvopTA_rtXZHv_78",
authDomain: "sismos-mp.firebaseapp.com",
databaseURL: "https://sismos-mp-default-rtdb.firebaseio.com",
projectId: "sismos-mp",
storageBucket: "sismos-mp.firebasestorage.app",
messagingSenderId: "457482276777",
appId: "1:457482276777:web:59907aef1e13b3c7f0beb8"
};
firebase.initializeApp(firebaseConfig);
const db=firebase.database();

/* RELOJ */
function actualizarReloj(){
let ahora=new Date();
let hora=ahora.toLocaleTimeString('es-MX');
let fecha=ahora.toLocaleDateString('es-MX',{
weekday:'long',
year:'numeric',
month:'long',
day:'numeric'
});
document.getElementById("reloj").innerHTML=hora;
document.getElementById("fecha").innerHTML=fecha;
}
setInterval(actualizarReloj,1000);
actualizarReloj();

/* VOZ */
function hablar(texto){
speechSynthesis.cancel();
let voz=new SpeechSynthesisUtterance(texto);
voz.lang="es-MX";
voz.rate=.95;
voz.pitch=1;
speechSynthesis.speak(voz);
}

/* ALERTA FUERTE */
function mostrarAlerta(data){
let alerta=document.getElementById("alerta");
document.body.style.background="#d50000";
document.getElementById("tituloAlerta").innerHTML=data.titulo || "🚨 ALERTA SÍSMICA";
document.getElementById("mensajeAlerta").innerHTML=data.mensaje || "Sismo detectado";
alerta.classList.add("active");

/* FULLSCREEN */
if(document.documentElement.requestFullscreen){
document.documentElement.requestFullscreen();
}

/* VIBRACIÓN */
navigator.vibrate([1000,300,1000,300,1000,300,1000]);

/* SONIDO FUERTE */
let audio=document.getElementById("audioFuerte");
audio.currentTime=0;
audio.volume=1;
audio.play();

/* VOZ */
hablar(data.mensaje || "Alerta sísmica activada");
}

/* ALERTA DÉBIL */
function mostrarDebil(data){
let toast=document.getElementById("toast");
document.getElementById("tituloToast").innerHTML=data.titulo || "🟡 Movimiento detectado";
document.getElementById("mensajeToast").innerHTML=data.mensaje || "Movimiento leve detectado";
toast.classList.add("active");

/* VIBRACIÓN SUAVE */
navigator.vibrate([200,100,200]);

/* SONIDO SUAVE */
let audio=document.getElementById("audioDebil");
audio.currentTime=0;
audio.volume=.5;
audio.play();

/* VOZ */
hablar(data.mensaje || "Movimiento leve detectado");

/* OCULTAR */
setTimeout(()=>{
toast.classList.remove("active");
},7000);
}

/* EMERGENCIA */
function mostrarEmergencia(data){
let alerta=document.getElementById("alerta");
alerta.style.background="#ff9800";
document.body.style.background="#ff9800";
document.getElementById("tituloAlerta").innerHTML=data.titulo || "⚠️ EMERGENCIA";
document.getElementById("mensajeAlerta").innerHTML=data.mensaje || "Emergencia detectada";
alerta.classList.add("active");

/* FULLSCREEN */
if(document.documentElement.requestFullscreen){
document.documentElement.requestFullscreen();
}

/* VIBRACIÓN */
navigator.vibrate([700,200,700,200,700]);

/* SONIDO */
let audio=document.getElementById("audioEmergencia");
audio.currentTime=0;
audio.volume=.9;
audio.play();

/* VOZ */
hablar(data.mensaje || "Emergencia activada");
}

/* DETENER */
function detenerTodo(){
document.getElementById("alerta").classList.remove("active");
document.body.style.background="#050b14";

/* PAUSAR AUDIOS */
document.getElementById("audioFuerte").pause();
document.getElementById("audioDebil").pause();
document.getElementById("audioEmergencia").pause();

/* DETENER VIBRACIÓN */
navigator.vibrate(0);

/* DETENER VOZ */
speechSynthesis.cancel();
}

/* ESCUCHAR FIREBASE */
db.ref("alerta").on("value",(snap)=>{
let data=snap.val();
if(!data) return;
console.log(data);

/* ALERTA FUERTE */
if(data.tipo==="fuerte"){
mostrarAlerta(data);
}

/* ALERTA DÉBIL */
if(data.tipo==="debil"){
mostrarDebil(data);
}

/* EMERGENCIA */
if(data.tipo==="emergencia"){
mostrarEmergencia(data);
}

/* STOP */
if(data.tipo==="stop"){
detenerTodo();
}
});

</script>
</body>
</html>
